name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portfolio
        run: npm run build
      # Outside Lovable, `npm run build` writes the static website to .output/public
      # (verified with a clean build). .output/server is unused on GitHub Pages.
      - name: Verify production output
        run: |
          ls -la .output/public
          test -s .output/public/index.html
          test -d .output/public/assets
          grep -aq "Girdhari Jaat" .output/public/index.html
          rm -f .output/public/_headers
          touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
