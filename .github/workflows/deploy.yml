name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Build portfolio
        run: bun run build
      - name: Verify production output (dist/client)
        run: |
          ls -la dist/client
          test -s dist/client/index.html
          test -d dist/client/assets
          grep -q "Girdhari Jaat" dist/client/index.html
          rm -f dist/client/_headers
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
